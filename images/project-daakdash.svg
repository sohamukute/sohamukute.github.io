<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#061a14" />
      <stop offset="100%" stop-color="#020c09" />
    </linearGradient>
    <linearGradient id="glow4" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#bg4)"/>
  <rect width="900" height="600" fill="url(#glow4)"/>

  <g transform="translate(60, 50)">
    <rect width="780" height="500" rx="14" fill="#04120e" stroke="#134e40" stroke-width="1.5"/>
    
    <rect width="780" height="42" rx="14" fill="#06241c"/>
    <rect x="0" y="28" width="780" height="14" fill="#06241c"/>
    <line x1="0" y1="42" x2="780" y2="42" stroke="#134e40" stroke-width="1"/>
    
    <circle cx="24" cy="21" r="5.5" fill="#ef4444" />
    <circle cx="42" cy="21" r="5.5" fill="#f59e0b" />
    <circle cx="60" cy="21" r="5.5" fill="#10b981" />
    <text x="390" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">DaakDash • Depot-to-Door Multimodal Parcel Engine</text>

    <!-- State Machine Pipeline -->
    <g transform="translate(30, 70)">
      
      <!-- State Nodes -->
      <g transform="translate(0, 20)">
        <rect width="150" height="100" rx="8" fill="#0b2c23" stroke="#059669"/>
        <text x="75" y="45" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ecfdf5">CREATED</text>
        <text x="75" y="70" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#6ee7b7">Seller drop at depot</text>
      </g>

      <path d="M 155 70 L 185 70" stroke="#10b981" stroke-width="2"/>

      <g transform="translate(190, 20)">
        <rect width="150" height="100" rx="8" fill="#0b2c23" stroke="#059669"/>
        <text x="75" y="45" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ecfdf5">SORTED</text>
        <text x="75" y="70" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#6ee7b7">Batched by destination</text>
      </g>

      <path d="M 345 70 L 375 70" stroke="#10b981" stroke-width="2"/>

      <g transform="translate(380, 20)">
        <rect width="150" height="100" rx="8" fill="#0b2c23" stroke="#059669"/>
        <text x="75" y="45" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ecfdf5">IN_TRANSIT</text>
        <text x="75" y="70" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#6ee7b7">Train long / Truck short</text>
      </g>

      <path d="M 535 70 L 565 70" stroke="#10b981" stroke-width="2"/>

      <g transform="translate(570, 20)">
        <rect width="150" height="100" rx="8" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
        <text x="75" y="45" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">DELIVERED</text>
        <text x="75" y="70" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#a7f3d0">OTP Verified Handover</text>
      </g>

      <!-- Multi-modal Route Map -->
      <g transform="translate(0, 160)">
        <rect width="720" height="190" rx="10" fill="#031a14" stroke="#0f4c3a"/>
        <text x="25" y="32" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#6ee7b7">Multimodal Lane Routing (12 Seeded Indian Hubs)</text>
        
        <g transform="translate(25, 55)" font-family="'JetBrains Mono', monospace" font-size="12">
          <text x="0" y="20" fill="#ecfdf5">Mumbai Depot (CSMT) ====== [Indian Railways] ======&gt; Delhi Hub (NDLS) [1,400km]</text>
          <text x="0" y="48" fill="#6ee7b7">  • Transit Time: 16 hrs • Cost: 1/4th of air cargo • Zero delay bottlenecks</text>
          
          <text x="0" y="85" fill="#ecfdf5">Delhi Hub ================= [Highway Express Truck] ==&gt; Noida Sector 62 [25km]</text>
          <text x="0" y="112" fill="#6ee7b7">  • Last Mile Assignment: Capacity-aware delivery partner • OTP: 829-104</text>
        </g>
      </g>
    </g>
  </g>
</svg>