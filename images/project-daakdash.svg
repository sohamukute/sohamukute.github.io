<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="grid-fade" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#262626" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#262626" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#0d0d0d" />
  <rect width="600" height="400" fill="url(#glow)" />

  <!-- Subtle Blueprint Grid lines -->
  <g stroke="url(#grid-fade)" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="400" />
    <line x1="180" y1="0" x2="180" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="420" y1="0" x2="420" y2="400" />
    <line x1="540" y1="0" x2="540" y2="400" />
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="160" x2="600" y2="160" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="320" x2="600" y2="320" />
  </g>

  <!-- Top Category Tag -->
  <g transform="translate(48, 56)">
    <rect width="110" height="24" rx="6" fill="#171717" stroke="#2e2e2e" stroke-width="1"/>
    <text x="55" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399" letter-spacing="0.08em">LOGISTICS</text>
  </g>

  <!-- Main Headline -->
  <text x="48" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#fafafa" letter-spacing="-0.03em">
    DEPOT TO DOOR.
  </text>
  <text x="48" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#34d399" letter-spacing="-0.03em">
    STATE MACHINE.
  </text>

  <!-- Code Hint at Bottom -->
  <g transform="translate(48, 320)">
    <rect width="504" height="42" rx="8" fill="#141414" stroke="#262626" stroke-width="1"/>
    <circle cx="20" cy="21" r="4" fill="#34d399" />
    <text x="36" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#a1a1a1">Auditable Parcel SM &gt; Multi-modal Route &gt; OTP Handover</text>
  </g>
</svg>