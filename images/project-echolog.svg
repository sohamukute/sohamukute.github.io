<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="glow1" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bg1)"/>
  <rect width="900" height="600" fill="url(#glow1)"/>

  <!-- Window Frame -->
  <g transform="translate(60, 50)">
    <rect width="780" height="500" rx="14" fill="#0d0e12" stroke="#27272a" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect width="780" height="42" rx="14" fill="#18181b"/>
    <rect x="0" y="28" width="780" height="14" fill="#18181b"/>
    <line x1="0" y1="42" x2="780" y2="42" stroke="#27272a" stroke-width="1"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="21" r="5.5" fill="#ef4444" />
    <circle cx="42" cy="21" r="5.5" fill="#f59e0b" />
    <circle cx="60" cy="21" r="5.5" fill="#10b981" />
    <text x="390" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#71717a">echo-log — broker-1:9092 (Java 21 NIO)</text>

    <!-- Terminal Content -->
    <g transform="translate(30, 70)" font-family="'JetBrains Mono', monospace" font-size="13">
      <text x="0" y="20" fill="#10b981">$ echo-log-server --config broker-1.properties</text>
      <text x="0" y="50" fill="#71717a">[INFO]  ZooKeeper quorum connected: 127.0.0.1:2181 (session=0x1928a)</text>
      <text x="0" y="80" fill="#71717a">[INFO]  Leader elected for partition [orders-0] • epoch=3, fencing_token=104</text>
      <text x="0" y="110" fill="#06b6d4">[NIO]   Selector initialized • non-blocking socket channel listening on :9092</text>
      <text x="0" y="140" fill="#71717a">[INFO]  Segment log created: /var/data/orders-0/00000000000000000000.log</text>
      <text x="0" y="170" fill="#a1a1aa">[PROD]  Batch appended: 50 records (offset: 0..49) • CRC32C verified • 0.42ms</text>
      <text x="0" y="200" fill="#a1a1aa">[REPL]  Follower broker-2 fetched up to offset 49 • HW updated to 49</text>
      
      <!-- Metric Boxes -->
      <g transform="translate(0, 240)">
        <rect width="225" height="75" rx="8" fill="#18181b" stroke="#27272a"/>
        <text x="16" y="28" font-size="10" fill="#71717a" text-transform="uppercase" letter-spacing="0.1em">THROUGHPUT</text>
        <text x="16" y="58" font-size="20" font-weight="700" fill="#f4f4f5">142,500 <tspan font-size="11" fill="#71717a">rec/sec</tspan></text>
      </g>
      <g transform="translate(245, 240)">
        <rect width="225" height="75" rx="8" fill="#18181b" stroke="#27272a"/>
        <text x="16" y="28" font-size="10" fill="#71717a" text-transform="uppercase" letter-spacing="0.1em">LATENCY (P99)</text>
        <text x="16" y="58" font-size="20" font-weight="700" fill="#06b6d4">1.28 <tspan font-size="11" fill="#71717a">ms</tspan></text>
      </g>
      <g transform="translate(490, 240)">
        <rect width="230" height="75" rx="8" fill="#18181b" stroke="#27272a"/>
        <text x="16" y="28" font-size="10" fill="#71717a" text-transform="uppercase" letter-spacing="0.1em">REPLICATION</text>
        <text x="16" y="58" font-size="20" font-weight="700" fill="#10b981">In-Sync (ISR: 3)</text>
      </g>

      <text x="0" y="370" fill="#22c55e">• Broker cluster healthy • 0 data loss • 3 partitions</text>
    </g>
  </g>
</svg>